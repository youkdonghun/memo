name: Build Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v1.1.2)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-status.txt; then
            test "$(cat draft-status.txt)" = true
          else
            NOTES=".github/release-notes/$RELEASE_TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "MEMO BOM $RELEASE_TAG" --notes-file "$NOTES"
            else
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "MEMO BOM $RELEASE_TAG" --generate-notes
            fi
          fi

  windows:
    name: Windows exe
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installers = @(Get-ChildItem dist/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $asset = "dist/MEMO-BOM-Setup-$version.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $asset
          gh release upload $env:RELEASE_TAG $asset --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mac:
    name: Mac dmg
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac disk image
        run: npm run dist:mac

      - name: Upload Mac disk image to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp dist/*.dmg "dist/MEMO-BOM-Setup-$VERSION-universal.dmg"
          gh release upload "$RELEASE_TAG" "dist/MEMO-BOM-Setup-$VERSION-universal.dmg" --clobber

  release:
    name: Publish installers
    needs: [prepare, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release download "$RELEASE_TAG" --dir release --pattern "MEMO-BOM-Setup-$VERSION.exe" --pattern "MEMO-BOM-Setup-$VERSION-universal.dmg"
          test -s "release/MEMO-BOM-Setup-$VERSION.exe"
          test -s "release/MEMO-BOM-Setup-$VERSION-universal.dmg"
          (cd release && sha256sum *.exe *.dmg > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
