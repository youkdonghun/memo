<!doctype html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMO BOM</title>
    <link rel="stylesheet" href="./detached.css" />
  </head>
  <body>
    <main class="detached-shell">

    </main>
    <script src="./detached.js"></script>
